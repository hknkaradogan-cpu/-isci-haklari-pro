<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<meta name="description" content="Kıdem, ihbar, yıllık izin, fazla mesai ve tatil çalışması alacağınızı hesaplayın. Çevrimdışı işçi hakları rehberi.">
<title>İşçi Hakları Pro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231565C0'/%3E%3Cpath d='M32 14v34M20 50h24M14 22h36M14 22l-6 14a6 6 0 0012 0zM50 22l-6 14a6 6 0 0012 0z' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<style>/*
VOICE: güvenilir, sakin bir finans uygulaması — Revolut/Google Wallet netliği
IDEA: bordro pusulası — her sonuç bir banka kartı kadar net
PICTURE: koyu mavi kahraman bandında yükselen sütun grafiği ve cam kartlar
COLOUR and TYPE: #1565C0 baskın, #42A5F5 destek, sarı vurgu; sistem Roboto
LAYOUT: tek sütun mobil akış, 2–3 sütun kart ızgarası, alt sekme çubuğu
*/
:root{
  --primary:#1565C0;--primary-d:#0D47A1;--secondary:#42A5F5;--success:#2E7D32;--warning:#F9A825;--error:#C62828;
  --bg:#F2F4F8;--surface:#fff;--surface-2:#F7F9FC;--tonal:#E3EEFB;--ink:#1A1F29;--muted:#5E6878;--line:#E2E7EF;
  --on-primary:#fff;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --r-lg:24px;--r-md:16px;--r-sm:12px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-mode=dark]{
  --primary:#64A9F5;--primary-d:#1565C0;--secondary:#90CAF9;--success:#66BB6A;--warning:#FFCA28;--error:#EF5350;
  --bg:#0B121D;--surface:#141D2B;--surface-2:#1A2536;--tonal:#1C2C44;--ink:#E7ECF3;--muted:#9AA6B8;--line:#26324A;
  --on-primary:#06182F;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;overflow-x:clip;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.ic{width:22px;height:22px;flex:none}
.ic.xl{width:56px;height:56px;color:var(--secondary);opacity:.8}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(160deg,#1565C0,#0D47A1);color:#fff;transition:opacity .45s}
#splash.hide{opacity:0;pointer-events:none}
#splash .sp{display:grid;justify-items:center;gap:14px}
#splash .sp-logo{width:88px;height:88px;border-radius:26px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;backdrop-filter:blur(8px);animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
#splash .sp-logo svg{width:50px;height:50px}
#splash b{font-size:24px;letter-spacing:.2px}#splash small{opacity:.8}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* App bar */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(10px + var(--safe-t)) 8px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
.appbar h1{font-size:19px;font-weight:600;margin:0 0 0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-actions{display:flex}
.icon-btn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--tonal)}.icon-btn.on{color:var(--warning)}
.icon-btn.glass{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}

.page{max-width:880px;margin:0 auto;padding:4px 16px calc(96px + var(--safe-b));display:grid;gap:16px}
.view.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}

/* Dashboard */
.dash-hero{background:radial-gradient(120% 80% at 100% 0,#2D7FD8 0,transparent 60%),linear-gradient(165deg,#1565C0,#0B3C8A);color:#fff;padding:calc(14px + var(--safe-t)) 16px 26px;border-radius:0 0 32px 32px}
:root[data-mode=dark] .dash-hero{background:radial-gradient(120% 80% at 100% 0,#1E4F8F 0,transparent 60%),linear-gradient(165deg,#0F3B78,#081A36)}
.dash-hero>*{max-width:848px;margin-inline:auto}
.dash-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}.brand small{display:block;opacity:.8;font-size:13px}.brand b{font-size:19px}
.logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center}
.feature-card{position:relative;display:block;overflow:hidden;padding:22px 20px;border-radius:var(--r-lg);background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(12px);box-shadow:0 12px 30px rgba(3,20,50,.25);transition:transform .2s}
.feature-card:active{transform:scale(.98)}
.feature-card h2{font-size:clamp(23px,5.6vw,32px);line-height:1.1;margin:10px 0 8px;max-width:62%;text-wrap:balance}
.feature-card p{margin:0 0 16px;opacity:.88;max-width:60%;font-size:15px}
.fc-tag{display:inline-block;font-size:12.5px;font-weight:600;background:#FFD54F;color:#3A2A00;padding:4px 10px;border-radius:99px}
.fc-cta{display:inline-flex;align-items:center;gap:4px;background:#fff;color:#0D47A1;font-weight:600;padding:10px 16px;border-radius:99px;font-size:15px}
.fc-cta .ic{width:18px;height:18px}
.fc-art{position:absolute;right:10px;bottom:12px;width:38%;max-width:200px;height:auto}
.stat-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{padding:12px 14px;border-radius:var(--r-md)}.stat small{display:block;font-size:12.5px;opacity:.82}.stat b{font-size:17px;white-space:nowrap}
.glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)}
.dash{padding-top:18px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.section-h h2{font-size:19px;margin:0}.section-h p{margin:0;color:var(--muted);font-size:14px}
.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.calc-card{display:grid;gap:4px;align-content:start;padding:16px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .18s,box-shadow .18s;animation:enter .4s both}
.calc-card:hover{transform:translateY(-2px)}.calc-card:active{transform:scale(.97)}
.card-grid .calc-card:nth-child(2){animation-delay:.04s}.card-grid .calc-card:nth-child(3){animation-delay:.08s}.card-grid .calc-card:nth-child(4){animation-delay:.12s}.card-grid .calc-card:nth-child(5){animation-delay:.16s}.card-grid .calc-card:nth-child(6){animation-delay:.2s}
.cc-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--tonal);color:var(--primary);margin-bottom:8px;flex:none}
.cc-ic.sm{width:38px;height:38px;border-radius:12px;margin:0}
.d1 .cc-ic{background:#E1F5FE;color:#0277BD}.d2 .cc-ic{background:#E8F5E9;color:var(--success)}.d3 .cc-ic{background:#FFF8E1;color:#B26A00}.d4 .cc-ic{background:#FFEBEE;color:var(--error)}.d5 .cc-ic{background:#EDE7F6;color:#5E35B1}
:root[data-mode=dark] .calc-card .cc-ic{background:var(--tonal)!important;color:var(--secondary)!important}
.cc-t{font-weight:600;font-size:15.5px;line-height:1.25}.cc-s{color:var(--muted);font-size:13px;line-height:1.35}
.tools .calc-card{background:var(--surface-2)}
.recent{display:grid;gap:8px}
.rec-mini{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line)}

/* Hesaplama sayfaları */
.hero-mini{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r-lg);background:linear-gradient(140deg,#1565C0,#0D47A1);color:#fff;box-shadow:0 10px 26px rgba(13,71,161,.25)}
:root[data-mode=dark] .hero-mini{background:linear-gradient(140deg,#123E7A,#0A2348)}
.hero-mini p{margin:0;font-size:15px;line-height:1.5;opacity:.95}
.hero-mini.accent-hero{background:radial-gradient(90% 120% at 100% 0,#42A5F5 0,transparent 55%),linear-gradient(140deg,#1565C0,#0B3C8A)}
.hero-ic{width:40px;height:40px;padding:8px;border-radius:12px;background:rgba(255,255,255,.16)}
.muted-inv{opacity:.8;margin:0 0 6px!important}
.hero-nums{display:flex;flex-wrap:wrap;gap:8px 22px}.hero-nums small{display:block;opacity:.8;font-size:12.5px}.hero-nums strong{font-size:20px;white-space:nowrap}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card-t{display:flex;align-items:center;gap:8px;font-size:16px;margin:0 0 12px}
.form{display:grid;gap:14px}
.grid-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-fields>.chips{grid-column:1/-1}
@media(max-width:560px){.grid-fields{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:6px}
.field-label{font-size:14px;font-weight:500;color:var(--muted)}
.field-box{position:relative;display:flex;align-items:center;background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-sm);transition:border-color .15s,box-shadow .15s}
.field-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.field-box input,.field-box select{flex:1;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;min-height:50px;padding:0 14px;outline:none;appearance:none}
.field-box .lead{margin-left:12px;color:var(--muted);width:20px}.field-box .lead+input{padding-left:8px}
.field-box .trail{position:absolute;right:12px;pointer-events:none;color:var(--muted)}
.suffix{padding-right:14px;color:var(--muted);font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
.chips{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.chips legend{margin-bottom:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:15px;font-weight:500;transition:.15s}
.chip input:checked+span{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip input:focus-visible+span{outline:2px solid var(--secondary);outline-offset:2px}
.form-actions,.action-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:99px;border:0;font-weight:600;font-size:15px;cursor:pointer;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.filled{background:var(--primary);color:var(--on-primary)}.btn.filled:hover{filter:brightness(1.08)}
.btn.tonal{background:var(--tonal);color:var(--primary)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn.danger{background:var(--error);color:#fff}
.btn.wide{flex:1}
.btn .ic{width:20px;height:20px}
:focus-visible{outline:2px solid var(--secondary);outline-offset:2px}

.results{display:grid;gap:14px}.results:empty{display:none}
.results.show>*{animation:rise .45s both}.results.show>*:nth-child(2){animation-delay:.06s}.results.show>*:nth-child(3){animation-delay:.12s}.results.show>*:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.result-card{display:grid;gap:4px;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.result-card.big{grid-column:1/-1;padding:22px;background:linear-gradient(135deg,#2E7D32,#1B5E20);color:#fff;border:0;box-shadow:0 12px 28px rgba(27,94,32,.28)}
:root[data-mode=dark] .result-card.big{background:linear-gradient(135deg,#1F5F25,#0F3A13)}
.rc-title{font-size:13.5px;color:var(--muted)}.big .rc-title{color:rgba(255,255,255,.85);font-size:14.5px}
.rc-amount{font-size:clamp(18px,4.6vw,22px);font-variant-numeric:tabular-nums;white-space:nowrap}
.big .rc-amount{font-size:clamp(30px,8vw,42px);line-height:1.1}
.rc-sub{font-size:13px;color:var(--muted)}.big .rc-sub{color:rgba(255,255,255,.85)}
.tone-error .rc-amount{color:var(--error)}.tone-primary .rc-amount{color:var(--primary)}
.detail{margin:0;display:grid}
.detail .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.detail .row:last-child{border:0}
.detail dt{color:var(--muted)}.detail dd{margin:0;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.detail .total dt{color:var(--ink);font-weight:600}.detail .total dd{color:var(--success);font-weight:700}
.detail .neg dd{color:var(--error)}
.info-card{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--tonal);font-size:14.5px}
.info-card .ic{color:var(--primary);margin-top:1px}.info-card p{margin:0}.info-card strong{display:block}
.info-card.tone-warn{background:color-mix(in srgb,var(--warning) 16%,var(--surface))}.info-card.tone-warn .ic{color:#B26A00}
.info-card.tone-muted{background:var(--surface-2);color:var(--muted);font-size:13px}.info-card.tone-muted .ic{color:var(--muted)}
.error-box{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--error) 12%,var(--surface));color:var(--error);font-weight:500}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:480px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{padding:10px;border-radius:var(--r-sm);background:var(--surface-2);border:1.5px solid var(--line);text-align:center}
.step b{display:block;font-size:16px}.step span{font-size:12.5px;color:var(--muted)}
.step.on{border-color:var(--primary);background:var(--tonal)}.step.on b{color:var(--primary)}

/* Ayrılış hesaplayıcı */
.quit-items{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.quit-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);background:var(--surface-2);animation:rise .5s both;animation-delay:var(--d)}
.quit-item.off{opacity:.55}
.qi-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--tonal);color:var(--primary);flex:none}
.qi-body{flex:1;display:grid}.qi-body span{font-size:13px;color:var(--muted)}
.qi-val{text-align:right;display:grid}.qi-val strong{font-size:16.5px;white-space:nowrap;font-variant-numeric:tabular-nums}.qi-val small{font-size:12px;color:var(--muted);white-space:nowrap}
.stack-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin-top:4px}
.stack-bar span{transform-origin:left;animation:grow .8s ease-out both}
@keyframes grow{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:14.5px}
th{color:var(--muted);font-weight:500;font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.prose h3{font-size:17px;margin:18px 0 6px}.prose p{margin:0 0 10px}.prose ul{margin:0 0 10px;padding-left:20px}.prose li{margin:4px 0}

/* Listeler */
.search{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:52px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted)}
.search:focus-within{border-color:var(--primary)}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:none;min-height:48px}
.article-list,.rec-list,.rem-list,.pick-list{display:grid;gap:10px}
.article-item{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);cursor:pointer}
.article-item .cc-ic{margin:0}.article-item>span:nth-child(2){flex:1;display:grid}.article-item small{color:var(--muted);font-size:13px}
.article-item .trail{color:var(--muted)}
.article h2{font-size:clamp(24px,6vw,32px);line-height:1.1;margin:8px 0 12px;text-wrap:balance}
.tag{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--primary);background:var(--tonal);padding:4px 10px;border-radius:99px}
.rec{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:8px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.rec.past{opacity:.6}
.rec-main{flex:1 1 260px;display:flex;align-items:center;gap:12px;padding:6px;border:0;background:transparent;text-align:left;cursor:pointer}
.rec-txt{flex:1;display:grid}.rec-txt small{color:var(--muted);font-size:13px}
.rec-amt{font-weight:700;color:var(--success);white-space:nowrap;font-variant-numeric:tabular-nums}
.rec-actions{display:flex;margin-left:auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;min-height:44px}
.check input,.pick input{width:20px;height:20px;accent-color:var(--primary)}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);cursor:pointer}
.pick:has(input:checked){border-color:var(--primary);background:var(--tonal)}
.empty{display:grid;justify-items:center;text-align:center;gap:6px;padding:36px 16px}
.empty h3{margin:6px 0 0}.empty p{margin:0 0 10px;color:var(--muted);max-width:340px}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar span{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--secondary),var(--primary));animation:growy .7s ease-out both;transform-origin:bottom}
.bar:last-child span{background:linear-gradient(#FFD54F,#F9A825)}
.bar small{font-size:11px;color:var(--muted)}
@keyframes growy{from{transform:scaleY(0)}}
.table-card{padding:6px 14px}

/* Ayarlar */
.set-group{display:grid;gap:4px}
.set-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border:0;background:transparent;text-align:left;width:100%;cursor:pointer;border-bottom:1px solid var(--line)}
.set-row:last-child{border:0}
.set-txt{flex:1;display:grid}.set-txt small{color:var(--muted);font-size:13px}
.set-row .trail{color:var(--muted)}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch i::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch input:checked+i{background:var(--primary)}.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2px solid var(--secondary);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface-2);border-radius:99px;padding:4px;border:1px solid var(--line)}
.seg input{position:absolute;opacity:0}
.seg span{display:grid;place-items:center;min-height:42px;border-radius:99px;cursor:pointer;font-weight:500}
.seg input:checked+span{background:var(--primary);color:var(--on-primary)}
.param{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.param span{color:var(--muted)}
.set-group .field{margin-top:10px}

/* Alt sekme çubuğu */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#tabbar a{flex:1;max-width:120px;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--muted);border-radius:16px}
#tabbar a .ic{width:24px;height:24px;padding:2px 14px;box-sizing:content-box;border-radius:99px;transition:.2s}
#tabbar a.on{color:var(--primary);font-weight:600}#tabbar a.on .ic{background:var(--tonal)}

/* Diyalog, toast, yükleniyor */
.dialog-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(5,12,24,.48);backdrop-filter:blur(3px);animation:fade .18s}
.dialog-wrap.out{opacity:0;transition:.18s}
@keyframes fade{from{opacity:0}}
.dialog{width:min(520px,100%);max-height:86vh;overflow:auto;background:var(--surface);border-radius:28px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .25s}
.dialog h3{margin:0 0 10px;font-size:20px}
.dialog h4{margin:14px 0 2px;font-size:14px;color:var(--primary)}
.dialog-body{font-size:15px}.dialog-body p{margin:0 0 10px}.dialog-body .field{margin-bottom:12px}
.dialog-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:14px}
.dialog-actions .btn{min-height:44px;padding:0 16px}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));z-index:70;transform:translate(-50%,20px);opacity:0;background:#1F2937;color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:.25s;max-width:calc(100% - 32px)}
.toast.in{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;z-index:65;display:grid;place-items:center;background:rgba(5,12,24,.4)}
.loading{display:flex;align-items:center;gap:12px;background:var(--surface);padding:16px 20px;border-radius:18px;box-shadow:var(--shadow)}
.spinner{width:24px;height:24px;border-radius:50%;border:3px solid var(--tonal);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
@media(max-width:600px){table{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

damga vergisi (binde 7,59) kesilir. Gelir vergisi ve SGK primi kesilmez.","## Zamana\u015F\u0131m\u0131","K\u0131dem tazminat\u0131 alaca\u011F\u0131nda zamana\u015F\u0131m\u0131 s\xFCresi 5 y\u0131ld\u0131r. Arabuluculu\u011Fa ba\u015Fvurmadan dava a\xE7\u0131lamaz."]},{id:"ihbar",title:"\u0130hbar tazminat\u0131 nedir?",tag:"Tazminat",ic:"notice",calc:"notice",body:["Belirsiz s\xFCreli i\u015F s\xF6zle\u015Fmesini fesheden taraf, kar\u015F\u0131 tarafa \xF6nceden bildirimde bulunmak zorundad\u0131r. Bu s\xFCreye uymayan taraf, bildirim s\xFCresine ait \xFCcret tutar\u0131nda ihbar tazminat\u0131 \xF6der (\u0130\u015F Kanunu md.17).","## Yasal bildirim s\xFCreleri","- \u0130\u015F ili\u015Fkisi 6 aydan az s\xFCrm\xFC\u015Fse: 2 hafta","- 6 ay \u2013 1,5 y\u0131l aras\u0131: 4 hafta","- 1,5 \u2013 3 y\u0131l aras\u0131: 6 hafta","- 3 y\u0131ldan fazla: 8 hafta","Bu s\xFCreler asgari s\xFCrelerdir; i\u015F s\xF6zle\u015Fmesiyle art\u0131r\u0131labilir.","## Bilmeniz gerekenler","- Bildirim s\xFCresi i\xE7inde i\u015Fveren, i\u015F\xE7iye g\xFCnde en az 2 saat i\u015F arama izni vermek zorundad\u0131r.","- \u0130\u015Fveren bildirim s\xFCresine ait \xFCcreti pe\u015Fin \xF6deyerek s\xF6zle\u015Fmeyi hemen sona erdirebilir.","- \u0130hbars\u0131z istifa eden i\u015F\xE7i, i\u015Fverene ihbar tazminat\u0131 \xF6demekle y\xFCk\xFCml\xFC olabilir.","- Hakl\u0131 nedenle (md.24 ve 25) yap\u0131lan fesihlerde ihbar s\xFCresi aranmaz.","## Kesintiler","\u0130hbar tazminat\u0131ndan SGK primi kesilmez; gelir vergisi ve damga vergisi kesilir."]},{id:"fazla-mesai",title:"Fazla mesai hakk\u0131",tag:"\xDCcret",ic:"clock",calc:"overtime",body:["Haftal\u0131k \xE7al\u0131\u015Fma s\xFCresi en fazla 45 saattir. Bu s\xFCreyi a\u015Fan \xE7al\u0131\u015Fmalar fazla \xE7al\u0131\u015Fmad\u0131r ve her saati i\xE7in normal saat \xFCcretinin %50 fazlas\u0131 \xF6denir (\u0130\u015F Kanunu md.41).","## Temel kurallar","- Fazla \xE7al\u0131\u015Fma i\xE7in i\u015F\xE7inin yaz\u0131l\u0131 onay\u0131 gerekir; onay her y\u0131l ba\u015F\u0131nda al\u0131n\u0131r.","- Y\u0131ll\u0131k fazla \xE7al\u0131\u015Fma s\xFCresi 270 saati a\u015Famaz.",'- Haftal\u0131k \xE7al\u0131\u015Fma 45 saatin alt\u0131nda kararla\u015Ft\u0131r\u0131lm\u0131\u015Fsa, s\xF6zle\u015Fme s\xFCresini a\u015F\u0131p 45 saate kadar olan \xE7al\u0131\u015Fmalar "fazla s\xFCrelerle \xE7al\u0131\u015Fma" say\u0131l\u0131r ve %25 zaml\u0131 \xF6denir.',"- \u0130\u015F\xE7i isterse fazla mesai \xFCcreti yerine her saat i\xE7in 1,5 saat serbest zaman kullanabilir.","## Hesaplama","Saatlik \xFCcret = Ayl\u0131k br\xFCt \xFCcret \xF7 225. Fazla mesai saat \xFCcreti = Saatlik \xFCcret \xD7 1,5.","## \u0130spat","Fazla mesainin ispat\u0131nda puantaj kay\u0131tlar\u0131, giri\u015F-\xE7\u0131k\u0131\u015F kartlar\u0131, e-postalar ve tan\u0131k beyanlar\u0131 kullan\u0131labilir. Fazla mesai alaca\u011F\u0131nda zamana\u015F\u0131m\u0131 5 y\u0131ld\u0131r."]},{id:"resmi-tatil",title:"Resmi tatil hakk\u0131",tag:"Tatil",ic:"flag",calc:"holiday-work",body:["Ulusal bayram ve genel tatil g\xFCnlerinde i\u015F\xE7i \xE7al\u0131\u015Fmazsa o g\xFCn\xFCn \xFCcreti kesilmeden \xF6denir. \xC7al\u0131\u015F\u0131rsa, ayr\u0131ca \xE7al\u0131\u015Ft\u0131\u011F\u0131 her g\xFCn i\xE7in bir g\xFCnl\xFCk \xFCcret daha al\u0131r (\u0130\u015F Kanunu md.47).","## Resmi tatil g\xFCnleri","- 1 Ocak Y\u0131lba\u015F\u0131","- 23 Nisan Ulusal Egemenlik ve \xC7ocuk Bayram\u0131","- 1 May\u0131s Emek ve Dayan\u0131\u015Fma G\xFCn\xFC","- 19 May\u0131s Atat\xFCrk'\xFC Anma, Gen\xE7lik ve Spor Bayram\u0131","- 15 Temmuz Demokrasi ve Mill\xEE Birlik G\xFCn\xFC","- 30 A\u011Fustos Zafer Bayram\u0131","- 29 Ekim Cumhuriyet Bayram\u0131 (28 Ekim \xF6\u011Fleden sonra yar\u0131m g\xFCn)","- Ramazan Bayram\u0131 (arife yar\u0131m g\xFCn + 3 g\xFCn) ve Kurban Bayram\u0131 (arife yar\u0131m g\xFCn + 4 g\xFCn)","## \xD6nemli","Resmi tatillerde \xE7al\u0131\u015F\u0131p \xE7al\u0131\u015F\u0131lmayaca\u011F\u0131 toplu s\xF6zle\u015Fme veya i\u015F s\xF6zle\u015Fmesiyle belirlenir; s\xF6zle\u015Fmede h\xFCk\xFCm yoksa i\u015F\xE7inin onay\u0131 gerekir."]},{id:"hafta-tatili",title:"Hafta tatili hakk\u0131",tag:"Tatil",ic:"week",calc:"weekend-work",body:["\u0130\u015F\xE7iye, tatil g\xFCn\xFCnden \xF6nce \xE7al\u0131\u015Ft\u0131\u011F\u0131 g\xFCnlerde haftal\u0131k \xE7al\u0131\u015Fma s\xFCresini tamamlamak \u015Fart\u0131yla, 7 g\xFCnl\xFCk d\xF6nem i\xE7inde kesintisiz en az 24 saat dinlenme verilmesi zorunludur (\u0130\u015F Kanunu md.46).","## Bilmeniz gerekenler","- Hafta tatili Pazar g\xFCn\xFC olmak zorunda de\u011Fildir; haftan\u0131n herhangi bir g\xFCn\xFC olabilir.","- Hafta tatili g\xFCn\xFC i\xE7in i\u015F\xE7iye \xE7al\u0131\u015Fmad\u0131\u011F\u0131 h\xE2lde o g\xFCn\xFCn \xFCcreti \xF6denir.","- Hafta tatilinde \xE7al\u0131\u015Ft\u0131r\u0131lan i\u015F\xE7iye, Yarg\u0131tay uygulamas\u0131na g\xF6re g\xFCnl\xFCk \xFCcretin %50 fazlas\u0131 (1,5 yevmiye) ek olarak \xF6denir.","- Hafta tatilinin s\xFCrekli kulland\u0131r\u0131lmamas\u0131, i\u015F\xE7iye hakl\u0131 fesih imk\xE2n\u0131 verebilir."]},{id:"yillik-izin",title:"Y\u0131ll\u0131k izin hakk\u0131",tag:"\u0130zin",ic:"beach",calc:"annual-leave",body:["\u0130\u015Fe ba\u015Flad\u0131\u011F\u0131 g\xFCnden itibaren, deneme s\xFCresi de dahil, en az 1 y\u0131l \xE7al\u0131\u015Fm\u0131\u015F i\u015F\xE7iye y\u0131ll\u0131k \xFCcretli izin verilir. Bu hakk\u0131ndan vazge\xE7ilemez (\u0130\u015F Kanunu md.53).","## \u0130zin s\xFCreleri","- 1 y\u0131ldan 5 y\u0131la kadar (5 y\u0131l dahil): 14 g\xFCn","- 5 y\u0131ldan fazla, 15 y\u0131ldan az: 20 g\xFCn","- 15 y\u0131l (dahil) ve daha fazla: 26 g\xFCn","- 18 ya\u015F ve alt\u0131 ile 50 ya\u015F ve \xFCzeri i\u015F\xE7iler: en az 20 g\xFCn","## Kullan\u0131m","- \u0130zin b\xF6l\xFCnebilir; ancak bir b\xF6l\xFCm\xFC 10 g\xFCnden az olamaz.","- \u0130zin s\xFCresine hafta tatili ve resmi tatiller eklenmez.","- Ba\u015Fka bir yerde izin kullanacak i\u015F\xE7iye istemesi h\xE2linde 4 g\xFCne kadar \xFCcretsiz yol izni verilir.","## \u0130zin \xFCcreti","\u0130\u015F s\xF6zle\u015Fmesi hangi nedenle sona ererse ersin, kullan\u0131lmayan izin s\xFCrelerinin \xFCcreti son \xFCcret \xFCzerinden \xF6denir (md.59). Bu alacakta zamana\u015F\u0131m\u0131, s\xF6zle\u015Fmenin sona ermesinden itibaren 5 y\u0131ld\u0131r."]},{id:"sgk",title:"SGK haklar\u0131",tag:"Sosyal g\xFCvenlik",ic:"shield",body:["\u0130\u015Fveren, i\u015F\xE7iyi i\u015Fe ba\u015Flamadan \xF6nce Sosyal G\xFCvenlik Kurumu'na bildirmek ve primlerini ger\xE7ek \xFCcret \xFCzerinden \xF6demek zorundad\u0131r.","## Temel haklar\u0131n\u0131z","- Sa\u011Fl\u0131k hizmetlerinden yararlanma (genel sa\u011Fl\u0131k sigortas\u0131)","- \u0130\u015F kazas\u0131 ve meslek hastal\u0131\u011F\u0131nda ge\xE7ici i\u015F g\xF6remezlik \xF6dene\u011Fi ve gerekirse s\xFCrekli i\u015F g\xF6remezlik geliri","- Hastal\u0131k ve anal\u0131k h\xE2linde rapor paras\u0131","- Ya\u015Fl\u0131l\u0131k (emeklilik), malull\xFCk ve \xF6l\xFCm ayl\u0131klar\u0131","- \u015Eartlar sa\u011Flan\u0131rsa i\u015Fsizlik \xF6dene\u011Fi","## Kontrol edin",'e-Devlet \xFCzerinden "SGK Tescil ve Hizmet D\xF6k\xFCm\xFC" ile prim g\xFCnlerinizi ve bildirilen \xFCcretinizi kontrol edebilirsiniz. Eksik veya d\xFC\u015F\xFCk bildirim varsa ALO 170 hatt\u0131na veya SGK il m\xFCd\xFCrl\xFC\u011F\xFCne ba\u015Fvurabilirsiniz. Sigortas\u0131z \xE7al\u0131\u015Ft\u0131r\u0131lmak, i\u015F\xE7iye hakl\u0131 fesih imk\xE2n\u0131 verir.',"## \u0130\u015Fsizlik \xF6dene\u011Fi","Son 3 y\u0131lda en az 600 g\xFCn prim \xF6demi\u015F, son 120 g\xFCn kesintisiz \xE7al\u0131\u015Fm\u0131\u015F ve kendi kusuru olmadan i\u015Fsiz kalm\u0131\u015F olman\u0131z gerekir. Ba\u015Fvuru, i\u015Ften ayr\u0131l\u0131\u015Ftan sonra 30 g\xFCn i\xE7inde \u0130\u015EKUR'a yap\u0131l\u0131r."]},{id:"mobbing",title:"Mobbing nedir?",tag:"\xC7al\u0131\u015Fma ortam\u0131",ic:"alert",body:["Mobbing (psikolojik taciz), i\u015Fyerinde bir \xE7al\u0131\u015Fan\u0131 sindirmek, d\u0131\u015Flamak ya da i\u015Ften ayr\u0131lmaya zorlamak amac\u0131yla sistematik ve s\xFCreklilik g\xF6steren kas\u0131tl\u0131 davran\u0131\u015Flard\u0131r.","## \xD6rnek davran\u0131\u015Flar","- S\xFCrekli a\u015Fa\u011F\u0131lama, alay etme, ba\u011F\u0131rma","- \u0130\u015F vermeme ya da yap\u0131lamayacak i\u015Fler y\xFCkleme","- Toplant\u0131lardan, bilgi ak\u0131\u015F\u0131ndan d\u0131\u015Flama","- As\u0131ls\u0131z s\xF6ylentiler yayma, yetkileri elinden alma","- Sebepsiz yer veya g\xF6rev de\u011Fi\u015Ftirme","## Ne yapabilirsiniz?","- Olaylar\u0131 tarih, saat ve tan\u0131klarla birlikte yaz\u0131l\u0131 olarak kaydedin; e-posta ve mesajlar\u0131 saklay\u0131n.","- \u0130\u015Fverene veya insan kaynaklar\u0131na yaz\u0131l\u0131 \u015Fik\xE2yette bulunun.","- ALO 170 hatt\u0131ndan destek al\u0131n.","- Mobbing, \u0130\u015F Kanunu md.24 kapsam\u0131nda hakl\u0131 fesih nedenidir; bu durumda k\u0131dem tazminat\u0131 ve manevi tazminat talep edilebilir."]},{id:"hakli-fesih",title:"Hakl\u0131 fesih nedir?",tag:"Fesih",ic:"law",calc:"quit",body:["Hakl\u0131 fesih, i\u015F s\xF6zle\u015Fmesinin bildirim s\xFCresi beklenmeden derh\xE2l sona erdirilmesidir. \u0130\u015F\xE7inin hakl\u0131 fesih nedenleri \u0130\u015F Kanunu md.24'te say\u0131lm\u0131\u015Ft\u0131r.","## \u0130\u015F\xE7inin hakl\u0131 fesih nedenleri","- Sa\u011Fl\u0131k sebepleri: \u0130\u015Fin niteli\u011Finden do\u011Fan sa\u011Fl\u0131k tehlikesi","- Ahlak ve iyi niyet kurallar\u0131na ayk\u0131r\u0131l\u0131k: \xDCcretin \xF6denmemesi veya eksik \xF6denmesi, fazla mesai \xFCcretinin \xF6denmemesi, SGK primlerinin eksik yat\u0131r\u0131lmas\u0131, mobbing, cinsel taciz, hakaret, \xE7al\u0131\u015Fma ko\u015Fullar\u0131n\u0131n esasl\u0131 \u015Fekilde de\u011Fi\u015Ftirilmesi","- Zorlay\u0131c\u0131 sebepler: \u0130\u015Fyerinde i\u015Fin 1 haftadan fazla durmas\u0131n\u0131 gerektiren zorlay\u0131c\u0131 durumlar","## Sonu\xE7lar\u0131","Hakl\u0131 nedenle fesheden i\u015F\xE7i, 1 y\u0131ll\u0131k \xE7al\u0131\u015Fma \u015Fart\u0131n\u0131 sa\u011Fl\u0131yorsa k\u0131dem tazminat\u0131 al\u0131r; ihbar tazminat\u0131 \xF6denmez. Fesih, nedeni \xF6\u011Frenildikten sonra 6 i\u015F g\xFCn\xFC ve her h\xE2lde olay\u0131n \xFCzerinden 1 y\u0131l ge\xE7meden yap\u0131lmal\u0131d\u0131r (\xFCcretin \xF6denmemesi gibi s\xFCregelen durumlar hari\xE7).","## Nas\u0131l yap\u0131l\u0131r?","Fesih bildirimi noter arac\u0131l\u0131\u011F\u0131yla, fesih nedeni a\xE7\u0131k\xE7a yaz\u0131larak yap\u0131lmal\u0131d\u0131r. Sonras\u0131nda alacaklar i\xE7in \xF6nce arabulucuya ba\u015Fvurulur."]},{id:"asgari-ucret",title:"Asgari \xFCcret ve haklar\u0131",tag:"\xDCcret",ic:"wallet",calc:"min-wage",body:["Asgari \xFCcret, i\u015F\xE7iye normal bir \xE7al\u0131\u015Fma g\xFCn\xFC kar\u015F\u0131l\u0131\u011F\u0131nda \xF6denmesi gereken en d\xFC\u015F\xFCk \xFCcrettir. Asgari \xDCcret Tespit Komisyonu taraf\u0131ndan belirlenir.","## 2026 y\u0131l\u0131 asgari \xFCcreti","- Br\xFCt: 33.030,00 TL","- Net: 28.075,50 TL","- G\xFCnl\xFCk br\xFCt: 1.101,00 TL","## Bilmeniz gerekenler","- Asgari \xFCcretin alt\u0131nda \xFCcret \xF6denemez; s\xF6zle\u015Fmede aksi yazsa bile ge\xE7ersizdir.","- 2022'den itibaren t\xFCm \xE7al\u0131\u015Fanlar\u0131n \xFCcretinin asgari \xFCcrete isabet eden k\u0131sm\u0131 gelir ve damga vergisinden istisnad\u0131r.","- Asgari \xFCcretin 1/4'\xFCnden fazlas\u0131 haczedilemez (nafaka bor\xE7lar\u0131 hari\xE7)."]}];function w1(t){let e="",r=!1;for(let i of t){if(i.startsWith("- ")){r||(e+="<ul>",r=!0),e+=`<li>${Te(i.slice(2))}</li>`;continue}r&&(e+="</ul>",r=!1),e+=i.startsWith("## ")?`<h3>${Te(i.slice(3))}</h3>`:`<p>${Te(i)}</p>`}return e+(r?"</ul>":"")}var nc={title:"\u0130\u015F\xE7i Haklar\u0131 K\xFCt\xFCphanesi",render(t){t.innerHTML=`${ir("\u0130\u015F\xE7i Haklar\u0131 K\xFCt\xFCphanesi")}
