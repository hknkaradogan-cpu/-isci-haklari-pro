name: APK ve Web Sitesi Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web uygulamasını derle ve Android'e kopyala
        run: npm run android:sync

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK dosyasını adlandır
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/IsciHaklariPro-v1.0.${{ github.run_number }}.apk"
          ls -la out

      - name: APK'yı yükle (Actions sekmesi)
        uses: actions/upload-artifact@v4
        with:
          name: IsciHaklariPro-APK
          path: out/*.apk

      - name: Telefondan indirilebilir sürüm (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: İşçi Hakları Pro v1.0.${{ github.run_number }}
          body: |
            Telefonunuza kurmak için aşağıdaki **.apk** dosyasına dokunun, indirin ve açın.
            İlk kurulumda "Bilinmeyen kaynaklardan uygulama yükleme" iznini vermeniz istenebilir.
          files: out/*.apk

  web:
    name: Web sitesi (gh-pages dalı)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: touch www/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          force_orphan: true
